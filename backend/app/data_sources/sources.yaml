# Реестр источников данных и их ограничений.
# Показывается на странице «Методика и источники» и в подсказках интерфейса.
# Поле `checked` — что именно и когда было проверено при разработке (ноябрь 2026 г.).
# Тексты двуязычные: ru / kk (казахский требует вычитки носителем языка).

power:
  title: NASA POWER (Daily API)
  provider: NASA Langley Research Center, проект POWER
  url: https://power.larc.nasa.gov/docs/services/api/temporal/daily/
  used_for:
    ru: "Осадки и температура воздуха с 1981 года; запасной показатель увлажнения почвы."
    kk: "1981 жылдан бергі жауын-шашын мен ауа температурасы; топырақ ылғалдылығының қосалқы көрсеткіші."
  provenance:
    ru: "Это не измерения на поле и не прямые спутниковые снимки, а реанализ — расчёт глобальной модели атмосферы MERRA-2 (свежие дни — GEOS-IT), в которую усвоены спутниковые и наземные наблюдения. PRECTOTCORR — осадки модели с поправкой по наблюдениям."
    kk: "Бұл егістіктегі өлшеу де, тікелей спутниктік түсірілім де емес, реанализ — спутниктік және жерүсті бақылаулары енгізілген MERRA-2 жаһандық атмосфера моделінің есебі (соңғы күндер — GEOS-IT). PRECTOTCORR — бақылаулар бойынша түзетілген модельдік жауын-шашын."
  spatial_resolution:
    ru: "Ячейка примерно 0,5° x 0,625° (около 55 x 43 км на широте 52°). Все поля внутри одной ячейки получают одинаковые значения."
    kk: "Ұяшық шамамен 0,5° x 0,625° (52° ендікте шамамен 55 x 43 км). Бір ұяшықтағы барлық егістік бірдей мән алады."
  resolution_m: 50000
  temporal_coverage:
    ru: "С 1 января 1981 года по настоящее время, шаг — сутки. Задержка последних данных — несколько дней."
    kk: "1981 жылғы 1 қаңтардан қазіргі уақытқа дейін, қадамы — тәулік. Соңғы деректердің кешігуі — бірнеше күн."
  access:
    ru: "Без ключа и регистрации. Не более 20 параметров в запросе; документация просит не запрашивать одну и ту же ячейку многократно, поэтому ответы кэшируются."
    kk: "Кілтсіз және тіркеусіз. Бір сұрауда 20 параметрден аспайды; құжаттама бір ұяшықты қайта-қайта сұрамауды өтінеді, сондықтан жауаптар кэштеледі."
  limitations:
    ru: "Летние ливни в степи локальны, а ячейка усредняет их по площади ~2 000 км², поэтому осадки на конкретном поле могут заметно отличаться. Данные ближайшей метеостанции точнее."
    kk: "Далада жазғы нөсер жергілікті сипатта болады, ал ұяшық оларды ~2 000 км² аумақта орташалайды, сондықтан нақты егістіктегі жауын-шашын айтарлықтай өзгеше болуы мүмкін. Жақын метеостанция деректері дәлірек."
  checked: "Живой запрос 12.11.2026: API v2.10.3, ряд 1981-01-01 … 2026-11-09 (16 750 суток), ответ ~2 с, пропуски = -999."
  status: active

modis:
  title: MODIS MOD13Q1 v6.1 (NDVI) через ORNL DAAC TESViS Web Service
  provider: NASA LP DAAC (продукт), ORNL DAAC (сервис вырезок)
  url: https://modis.ornl.gov/data/modis_webservice.html
  doi: https://doi.org/10.5067/MODIS/MOD13Q1.061
  used_for:
    ru: "Индекс растительности NDVI по полю с 2000 года, тренд и пиксельный слой карты."
    kk: "2000 жылдан бергі егістік бойынша NDVI өсімдік индексі, тренд және картаның пиксельдік қабаты."
  provenance:
    ru: "Спутниковые измерения прибора MODIS (спутник Terra). Каждое значение — лучший (малооблачный) пиксель за 16 дней."
    kk: "MODIS аспабының (Terra спутнигі) спутниктік өлшеулері. Әр мән — 16 күндегі ең жақсы (бұлты аз) пиксель."
  spatial_resolution:
    ru: "Пиксель номинально 250 м (фактически ~232 м, ≈ 5,4 га). На поле 400 га попадает около 75 пикселей; поля меньше ~20 га оцениваются по 1–3 пикселям и захватывают соседние участки."
    kk: "Пиксель атаулы 250 м (іс жүзінде ~232 м, ≈ 5,4 га). 400 га егістікке шамамен 75 пиксель келеді; ~20 га-дан кіші егістік 1–3 пиксельмен бағаланады және көрші телімдерді қамтиды."
  resolution_m: 250
  temporal_coverage:
    ru: "С 18 февраля 2000 года по настоящее время, один композит раз в 16 дней. Мы берём 10 композитов сезона (с ~9 мая по ~30 сентября)."
    kk: "2000 жылғы 18 ақпаннан қазіргі уақытқа дейін, 16 күнде бір композит. Біз маусымның 10 композитін аламыз (~9 мамырдан ~30 қыркүйекке дейін)."
  access:
    ru: "Без ключа. Не более 10 дат на запрос и окно до 100 км; один запрос выполняется 30–50 секунд, поэтому полный ряд нового поля загружается несколько минут (в фоне, затем из кэша)."
    kk: "Кілтсіз. Бір сұрауда 10 күннен аспайды, терезе 100 км-ге дейін; бір сұрау 30–50 секунд орындалады, сондықтан жаңа егістіктің толық қатары бірнеше минут жүктеледі (фонда, кейін кэштен)."
  limitations:
    ru: "NDVI показывает зелёную массу, а не урожай и не культуру. Облака и снег отсекаются маской качества (pixel_reliability 0–1). Сертификат сайта выпущен в цепочке emSign — нужен свежий набор корневых сертификатов (certifi ≥ 2026.10.23)."
    kk: "NDVI өнімді де, дақыл түрін де емес, жасыл массаны көрсетеді. Бұлт пен қар сапа маскасымен алынып тасталады (pixel_reliability 0–1). Сайт сертификаты emSign тізбегінде шығарылған — жаңа түбірлік сертификаттар жинағы қажет (certifi ≥ 2026.10.23)."
  checked: "Живые запросы 12.11.2026: 614 дат (2000-02-18 … 2026-10-16); 11 дат в запросе → HTTP 400 «exceeds maximum subset tiles support of 10»; 8 параллельных запросов ≈ 50 с."
  status: active

soilgrids:
  title: ISRIC SoilGrids 2.0 (REST API)
  provider: ISRIC — World Soil Information
  url: https://rest.isric.org/soilgrids/v2.0/docs
  used_for:
    ru: "Органический углерод, глина, песок и pH по слоям до 1 м. По ним считается влагоёмкость почвы."
    kk: "1 м-ге дейінгі қабаттар бойынша органикалық көміртек, саз, құм және pH. Олар арқылы топырақтың ылғал сыйымдылығы есептеледі."
  provenance:
    ru: "Это не анализ почвы вашего поля, а глобальная карта-прогноз — модель машинного обучения, обученная на почвенных разрезах со всего мира и спутниковых и климатических слоях."
    kk: "Бұл сіздің егістігіңіздің топырақ талдауы емес, жаһандық болжам-карта — дүниежүзілік топырақ кескіндері мен спутниктік және климаттық қабаттарда оқытылған машиналық оқыту моделі."
  spatial_resolution:
    ru: "Сетка 250 м, но реальная детальность ниже: в Северном Казахстане мало опорных разрезов. Берётся одна точка — центр поля."
    kk: "Тор 250 м, бірақ нақты дәлдігі төмен: Солтүстік Қазақстанда тірек кескіндер аз. Бір нүкте — егістік ортасы алынады."
  resolution_m: 250
  temporal_coverage:
    ru: "Статичная карта (один срез, без рядов по годам). Изменение гумуса во времени по ней увидеть нельзя."
    kk: "Статикалық карта (бір кесінді, жылдар бойынша қатарсыз). Гумустың уақыт бойынша өзгеруін одан көру мүмкін емес."
  access:
    ru: "Без ключа, сервис в статусе бета. Ответ занимает 10–30 секунд и периодически недоступен — тогда показываются сохранённые значения с предупреждением."
    kk: "Кілтсіз, сервис бета күйінде. Жауап 10–30 секунд алады және кейде қолжетімсіз — мұндайда ескертумен сақталған мәндер көрсетіледі."
  limitations:
    ru: "Для решений о внесении удобрений нужен агрохимический анализ почвы. Вместе со средним значением показываем интервал 5–95 % модели."
    kk: "Тыңайтқыш енгізу туралы шешім үшін топырақтың агрохимиялық талдауы қажет. Орташа мәнмен бірге модельдің 5–95 % аралығын көрсетеміз."
  checked: "Живой запрос 12.11.2026: ответ 200 за 22 с; повторный запрос к openapi.json — тайм-аут 40 с (нестабильность подтверждена)."
  status: active

smap:
  title: SMAP SPL3SMP_E v006 (влажность почвы)
  provider: NASA NSIDC DAAC
  url: https://nsidc.org/data/spl3smp_e/versions/6
  doi: https://doi.org/10.5067/M20OXIZHY3RJ
  used_for:
    ru: "Влажность верхнего слоя почвы в апреле–мае (перед посевом) по годам и слой карты."
    kk: "Жылдар бойынша сәуір–мамырдағы (егіс алдындағы) топырақтың беткі қабатының ылғалдылығы және карта қабаты."
  provenance:
    ru: "Спутниковые измерения микроволнового радиометра SMAP, пересчитанные в объёмную влажность почвы. Чувствует только верхние ~5 см."
    kk: "SMAP микротолқынды радиометрінің топырақтың көлемдік ылғалдылығына қайта есептелген спутниктік өлшеулері. Тек үстіңгі ~5 см қабатты сезеді."
  spatial_resolution:
    ru: "Данные усреднены по ячейке ~9 км (≈ 8 100 га; на широте 52° ячейка вытянута: примерно 6 x 13 км). Это шаг сетки; сам радиометр видит пятно около 33–40 км, так что реальная детальность ещё грубее. Поле целиком лежит внутри одной ячейки вместе с соседними полями, лесополосами и водоёмами."
    kk: "Деректер ~9 км ұяшық бойынша орташаланған (≈ 8 100 га; 52° ендікте ұяшық созылыңқы: шамамен 6 x 13 км). Бұл тор қадамы; радиометрдің өзі шамамен 33–40 км дақты көреді, сондықтан нақты дәлдік одан да дөрекі. Егістік көрші егістіктермен, орман жолақтарымен және су айдындарымен бірге бір ұяшықтың ішінде жатады."
  resolution_m: 9000
  temporal_coverage:
    ru: "С 31 марта 2015 года, ежедневно; пролёт над одной точкой — раз в 2–3 дня. До 2015 года данных нет, поэтому засухи 2010 и 2012 годов в этом ряду отсутствуют."
    kk: "2015 жылғы 31 наурыздан, күн сайын; бір нүктенің үстінен 2–3 күнде бір ұшып өтеді. 2015 жылға дейін дерек жоқ, сондықтан 2010 және 2012 жылдардағы құрғақшылық бұл қатарда жоқ."
  access:
    ru: "Нужен бесплатный аккаунт NASA Earthdata. Суточный файл весит ~650 МБ, поэтому берём только окно 3x3 ячейки через OPeNDAP (~3 с на день, ряд нового поля — несколько минут в фоне)."
    kk: "NASA Earthdata тегін аккаунты қажет. Тәуліктік файл ~650 МБ, сондықтан OPeNDAP арқылы тек 3x3 ұяшық терезесін аламыз (күніне ~3 с, жаңа егістік қатары — фонда бірнеше минут)."
  limitations:
    ru: "Мёрзлая почва и снег не измеряются (в начале апреля данных обычно нет). Поверхностные 5 см не равны запасу влаги в метровом слое — мы используем их как показатель степени увлажнения профиля, и это допущение."
    kk: "Тоң топырақ пен қар өлшенбейді (сәуірдің басында дерек әдетте жоқ). Беткі 5 см метрлік қабаттағы ылғал қорына тең емес — біз оны кескіннің ылғалдану дәрежесінің көрсеткіші ретінде қолданамыз, бұл — болжам."
  checked: "CMR 12.11.2026: коллекция C2938664763-NSIDC_CPRD, начало 2015-03-31, последняя гранула 2026-11-10. OPeNDAP-вырезка 3x3 — HTTP 200 за 3 с."
  status: active

gpm:
  title: GPM IMERG Final v07 (осадки)
  provider: NASA GES DISC
  url: https://gpm.nasa.gov/data/imerg
  doi: https://doi.org/10.5067/GPM/IMERGDF/DAY/07
  used_for:
    ru: "Более детальные осадки (0,1°). В MVP не подключено — используется NASA POWER."
    kk: "Неғұрлым егжей-тегжейлі жауын-шашын (0,1°). MVP-де қосылмаған — NASA POWER қолданылады."
  provenance:
    ru: "Объединение микроволновых и инфракрасных наблюдений группировки спутников, откалиброванное по наземным осадкомерам (версия Final)."
    kk: "Спутниктер тобының микротолқынды және инфрақызыл бақылауларының жерүсті жауын өлшегіштері бойынша калибрленген бірлестігі (Final нұсқасы)."
  spatial_resolution:
    ru: "Ячейка 0,1° (около 11 x 7 км на широте 52°)."
    kk: "Ұяшық 0,1° (52° ендікте шамамен 11 x 7 км)."
  resolution_m: 10000
  temporal_coverage:
    ru: "По каталогу CMR суточный продукт Final v07 охватывает 1998-01-01 … 2025-09-30; задержка версии Final — около 3,5 месяца. Точность ниже над снегом и мёрзлой поверхностью."
    kk: "CMR каталогы бойынша Final v07 тәуліктік өнімі 1998-01-01 … 2025-09-30 аралығын қамтиды; Final нұсқасының кешігуі — шамамен 3,5 ай. Қар мен тоң бетінде дәлдігі төмен."
  access:
    ru: "Нужен аккаунт NASA Earthdata."
    kk: "NASA Earthdata аккаунты қажет."
  limitations:
    ru: "Модуль-заготовка `data_sources/gpm.py` описывает, как подключить источник без изменения остального кода."
    kk: "`data_sources/gpm.py` дайындама модулі дереккөзді қалған кодты өзгертпей қалай қосуға болатынын сипаттайды."
  checked: "Только метаданные CMR 12.11.2026 (C2723754864-GES_DISC). Данные не запрашивались."
  status: planned

landsat:
  title: Landsat Collection 2 Level-2 (NDVI 30 м)
  provider: USGS / NASA; доступ через Microsoft Planetary Computer STAC
  url: https://planetarycomputer.microsoft.com/dataset/landsat-c2-l2
  used_for:
    ru: "Детальный NDVI (30 м) для ретро-проверки на небольших полях. В MVP не подключено — используется MODIS."
    kk: "Шағын егістіктердегі ретро-тексеруге арналған егжей-тегжейлі NDVI (30 м). MVP-де қосылмаған — MODIS қолданылады."
  provenance:
    ru: "Спутниковые снимки Landsat 4–9 после атмосферной коррекции (отражательная способность поверхности)."
    kk: "Атмосфералық түзетуден кейінгі Landsat 4–9 спутниктік түсірілімдері (беттің шағылыстыру қабілеті)."
  spatial_resolution:
    ru: "Пиксель 30 м (0,09 га)."
    kk: "Пиксель 30 м (0,09 га)."
  resolution_m: 30
  temporal_coverage:
    ru: "С 22 августа 1982 года; повтор съёмки 16 дней на спутник (8 дней при двух спутниках). Из-за облаков за сезон бывает всего несколько чистых снимков."
    kk: "1982 жылғы 22 тамыздан; түсірілім бір спутникке 16 күнде қайталанады (екі спутникпен 8 күн). Бұлттың салдарынан маусымда небәрі бірнеше таза түсірілім болады."
  access:
    ru: "Чтение без ключа; ссылки на файлы нужно подписывать через API Planetary Computer."
    kk: "Кілтсіз оқу; файл сілтемелеріне Planetary Computer API арқылы қол қою қажет."
  limitations:
    ru: "Модуль-заготовка `data_sources/landsat.py` описывает, как подключить источник без изменения остального кода."
    kk: "`data_sources/landsat.py` дайындама модулі дереккөзді қалған кодты өзгертпей қалай қосуға болатынын сипаттайды."
  checked: "Только метаданные STAC 12.11.2026 (коллекция landsat-c2-l2, GSD 30 м). Данные не запрашивались."
  status: planned
