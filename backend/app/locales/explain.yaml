# Шаблоны объяснений «простыми словами». Тексты собираются из сработавших правил, без LLM.
# Казахский перевод требует вычитки носителем языка.

legume_then_cereal:
  ru: "Предшественник — {prev}: бобовая культура берёт азот из воздуха и оставляет его в почве. Поэтому {crop} в {year} году даст примерно на {pct} % больше, чем по зерновому предшественнику."
  kk: "Алғы дақыл — {prev}: бұршақ дақылы азотты ауадан алып, топырақта қалдырады. Сондықтан {year} жылы {crop} астық алғы дақылына қарағанда шамамен {pct} % артық өнім береді."

break_crop:
  ru: "Предшественник — {prev}: смена культуры прерывает цикл болезней и сорняков, и {crop} в {year} году даст примерно на {pct} % больше."
  kk: "Алғы дақыл — {prev}: дақылды ауыстыру аурулар мен арамшөптердің циклін үзеді, сондықтан {year} жылы {crop} шамамен {pct} % артық өнім береді."

bad_predecessor:
  ru: "Предшественник — {prev}: для культуры «{crop}» это неудачное соседство, в {year} году урожайность ниже примерно на {pct} %."
  kk: "Алғы дақыл — {prev}: «{crop}» дақылы үшін бұл сәтсіз кезек, {year} жылы өнімділік шамамен {pct} % төмен."

monoculture:
  ru: "{crop_cap} идёт {run}-й год подряд ({year}): накапливаются болезни и сорняки, урожайность ниже ещё на {pct} %, индекс почвы теряет дополнительные пункты."
  kk: "{crop_cap} қатарынан {run}-жыл егіледі ({year}): аурулар мен арамшөптер жиналады, өнімділік тағы {pct} % төмендейді, топырақ индексі қосымша ұпай жоғалтады."

fallow_next:
  ru: "Пар в {year} году дохода не даёт и теряет гумус (около {humus} т/га), зато запас влаги к посеву следующей культуры ({next}) больше примерно на {gain} % (+{mm} мм)."
  kk: "{year} жылғы пар табыс бермейді және гумус жоғалтады (шамамен {humus} т/га), бірақ келесі дақылды ({next}) себер алдындағы ылғал қоры шамамен {gain} % артық (+{mm} мм)."

fallow_last:
  ru: "Пар в {year} году дохода не даёт и теряет гумус (около {humus} т/га), но накапливает влагу для следующего сезона."
  kk: "{year} жылғы пар табыс бермейді және гумус жоғалтады (шамамен {humus} т/га), бірақ келесі маусымға ылғал жинайды."

drought_compare:
  ru: "Если год окажется засушливым, как {dry_year}-й, меньше всего урожая потеряет {best} (около {best_pct} %), больше всего — {worst} (около {worst_pct} %)."
  kk: "Егер жыл {dry_year} жылғыдай құрғақ болса, өнімді ең аз жоғалтатын — {best} (шамамен {best_pct} %), ең көп жоғалтатын — {worst} (шамамен {worst_pct} %)."

drought_single:
  ru: "Если год окажется засушливым, как {dry_year}-й, {crop} потеряет около {pct} % урожая."
  kk: "Егер жыл {dry_year} жылғыдай құрғақ болса, {crop} өнімнің шамамен {pct} %-ын жоғалтады."

water_deficit:
  ru: "Самая влаголюбивая культура варианта — {crop}: на сезон нужно около {need} мм влаги, а поле в обычный год даёт около {water} мм."
  kk: "Нұсқадағы ылғалды ең көп қажет ететін дақыл — {crop}: оған маусымда шамамен {need} мм ылғал керек, ал егістік қалыпты жылы шамамен {water} мм береді."

nitrogen_positive:
  ru: "Баланс азота за {n_years} положительный: около +{kg} кг на гектар."
  kk: "{n_years}ғы азот балансы оң: гектарына шамамен +{kg} кг."

nitrogen_negative:
  ru: "За {n_years} почва отдаст около {kg} кг азота с гектара (без учёта удобрений)."
  kk: "{n_years}да топырақ гектарынан шамамен {kg} кг азот береді (тыңайтқыштарды есепке алмағанда)."

humus:
  ru: "Запас гумуса за {n_years} изменится примерно на {t} т/га."
  kk: "{n_years}да гумус қоры шамамен {t} т/га-ға өзгереді."

income_more:
  ru: "Доход за {n_years} — около {income} тенге с гектара: на {diff} тенге/га больше, чем вариант «{base}»."
  kk: "{n_years}ғы табыс — гектарынан шамамен {income} теңге: «{base}» нұсқасынан {diff} теңге/га артық."

income_less:
  ru: "Доход за {n_years} — около {income} тенге с гектара: на {diff} тенге/га меньше, чем вариант «{base}»."
  kk: "{n_years}ғы табыс — гектарынан шамамен {income} теңге: «{base}» нұсқасынан {diff} теңге/га кем."

income_base:
  ru: "Доход за {n_years} — около {income} тенге с гектара. С этим вариантом сравниваются остальные."
  kk: "{n_years}ғы табыс — гектарынан шамамен {income} теңге. Қалған нұсқалар осы нұсқамен салыстырылады."

fits_priority:
  ru: "По выбранному приоритету «{priority}» у этого варианта самый высокий взвешенный балл: {score} из 5. Остальные варианты тоже остаются на выбор — решение за вами."
  kk: "Таңдалған «{priority}» басымдығы бойынша бұл нұсқаның өлшенген ұпайы ең жоғары: 5-тен {score}. Қалған нұсқалар да таңдауда қалады — шешім өзіңізде."

assumptions:
  ru: "В расчёте этого варианта {n_assumptions} из {n_params} значений пока не подтверждены источником для Северного Казахстана и требуют проверки агрономом."
  kk: "Бұл нұсқаның есебіндегі {n_params} мәннің {n_assumptions}-і Солтүстік Қазақстан үшін дереккөзбен әлі расталмаған және агрономның тексеруін қажет етеді."
