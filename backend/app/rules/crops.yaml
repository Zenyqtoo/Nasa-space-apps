       note: "Направление подтверждено: Walley et al. (2007) — горох и чечевица чаще дают положительный вклад в баланс азота, но он сильно колеблется по годам. Величина +15 кг/га — оценка"}
    humus_balance_t_ha:
      {value: -0.3, unit: "т/га в год", source: expert_guess, status: assumption, evidence: preliminary,
       note: "Принято меньше потерь, чем под зерновыми (богатые азотом остатки). Числовой опоры нет. TODO: проверить у агронома"}

