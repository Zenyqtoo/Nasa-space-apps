    ky:
      {value: 1.0, unit: "—", source: expert_guess, status: assumption, evidence: agronomist_review,
       note: "Специфичного Ky для чечевицы в FAO-33/56 нет. FAO-56: «для культур, где Ky неизвестен, можно использовать Ky = 1» — методическое значение по умолчанию, сверено"}
    nitrogen_balance_kg_ha:
