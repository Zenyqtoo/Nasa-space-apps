# Культуры. У каждого значения: value, unit, source (id из sources.yaml), status, note.
#   status: verified   — значение есть в указанном источнике и проверено при разработке;
#   status: assumption — правдоподобное значение без проверенного первоисточника
#                        для условий Северного Казахстана. В интерфейсе помечается «требует проверки».
#
# base_yield_t_ha — типичная урожайность «по зерновому предшественнику» для севера Казахстана;
#   для области умножается на regions.yaml -> yield_index.
# water_need_mm   — потребность культуры во влаге за сезон (ETm) для формулы FAO-33.
# ky              — коэффициент реакции урожая на дефицит влаги (FAO): Ky > 1 — культура чувствительна,
#                   Ky < 1 — переносит дефицит лучше. Заменяет «засухоустойчивость 0–1» из постановки:
#                   у Ky есть опубликованные значения.
# nitrogen_balance_kg_ha — баланс азота почвы за год без удобрений (фиксация минус вынос с зерном).
# humus_balance_t_ha     — изменение запаса гумуса за год.

crops:
  wheat:
    name: {ru: "Пшеница яровая", kk: "Жаздық бидай"}
    short: {ru: "пшеница", kk: "бидай"}
    group: cereal
    nitrogen_fixing: false
    base_yield_t_ha:
      {value: 1.1, unit: "т/га", source: stat_gov_kz, status: assumption,
       note: "Типичная урожайность, оценка. Опоры из новостей: по стране 9,8 ц/га в 2021 г., 13,6 в 2022 г., 16 в 2024 г. TODO: проверить у агронома и взять среднее за 5 лет по области на stat.gov.kz"}
    price_kzt_t:
      {value: 67500, unit: "тенге/т", source: task_statement, status: assumption,
       note: "Из постановки задачи: 65–70 тыс. тенге/т, взята середина. Внимание: закупочная цена пшеницы 3 класса урожая 2026 г. — 92–115 тыс. тенге/т (inform.kz). Проверить и обновить"}
    cost_kzt_ha:
      {value: 60000, unit: "тенге/га", source: expert_guess, status: assumption,
       note: "TODO: проверить у агронома. Ориентир для уточнения — нормативы затрат на гектар по областям (zakon.uchet.kz, V1500011418)"}
    water_need_mm:
      {value: 550, unit: "мм", source: fao_water_needs, status: assumption,
       note: "FAO: пшеница/ячмень/овёс 450–650 мм за сезон (диапазон проверен). Взята середина; для короткого сезона Северного Казахстана может быть ниже. TODO: проверить у агронома"}
    ky:
      {value: 1.15, unit: "—", source: fao56, status: assumption,
       note: "Яровая пшеница, FAO-56 табл. 24. Значение записано по памяти разработчика: сверить с таблицей"}
    nitrogen_balance_kg_ha:
      {value: -25, unit: "кг N/га в год", source: expert_guess, status: assumption,
       note: "Вынос с зерном ~1,1 т/га при ~2,3 % азота, без удобрений. TODO: проверить у агронома"}
    humus_balance_t_ha:
      {value: -0.5, unit: "т/га в год", source: kazhydromet_humus, status: assumption,
       note: "Нижняя граница диапазона 0,5–1 т/га для зерновых (солома остаётся в поле). Диапазон из журнала Казгидромета, выбор значения — допущение"}

