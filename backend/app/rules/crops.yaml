       note: "МСХ РК, 27.07.2026: чечевица красная 127 тг/кг БЕЗ НДС (остальные культуры в документе — с НДС). Цена сильно колеблется (в декабре 2024 г. — 169)"}
    cost_kzt_ha:
      {value: 80000, unit: "тенге/га", source: expert_guess, status: assumption, evidence: preliminary, note: "TODO: проверить у агронома"}
    water_need_mm:
