# Поле evidence — класс обоснованности (аудит модели, docs/MODEL_AUDIT.md):
#   literature — значение или диапазон есть в научном/официальном источнике (сверено с текстом);
#   agronomist_review — косвенная опора (другой регион, аналог, один год, расчёт), нужна проверка агрономом;
#   preliminary — предварительное допущение без источника или параметр конструкции модели;
#   definition — определение, тривиальное значение или величина, рассчитанная из данных.
# status: verified ставится только при literature/definition, если значение применимо к Северному Казахстану.
# Культуры. У каждого значения: value, unit, source (id из sources.yaml), status, note.
#   status: verified   — значение есть в указанном источнике и проверено при разработке;
#   status: assumption — правдоподобное значение без проверенного первоисточника
#                        для условий Северного Казахстана. В интерфейсе помечается «требует проверки».
#
# base_yield_t_ha — типичная урожайность «по зерновому предшественнику» для севера Казахстана;
#   для области умножается на regions.yaml -> yield_index.
# water_need_mm   — потребность культуры во влаге за сезон (ETm) для формулы FAO-33.
# ky              — коэффициент реакции урожая на дефицит влаги (FAO): Ky > 1 — культура чувствительна,
#                   Ky < 1 — переносит дефицит лучше. Заменяет «засухоустойчивость 0–1» из постановки:
#                   у Ky есть опубликованные значения.
# nitrogen_balance_kg_ha — баланс азота почвы за год без удобрений (фиксация минус вынос с зерном).
# humus_balance_t_ha     — изменение запаса гумуса за год.

crops:
  wheat:
    name: {ru: "Пшеница яровая", kk: "Жаздық бидай", en: "Spring wheat"}
    short: {ru: "пшеница", kk: "бидай", en: "wheat"}
    group: cereal
    nitrogen_fixing: false
    base_yield_t_ha:
      {value: 1.1, unit: "т/га", source: akmola_harvest_2025, status: assumption, evidence: agronomist_review,
       note: "1,1 т/га × индекс Акмолинской обл. 0,91 ≈ 1,0 т/га — внутри наблюдаемого диапазона: Акмолинская обл. 16,3 ц/га (2025, рекорд), 14,1 ц/га (2024), около 6,4 ц/га в засушливый год; РК 9,8 (2021), 13,6 (2022), 16,3 ц/га (2025, зерновые и зернобобовые, БНС). Областная статистика включает пшеницу по пару (выше, чем по стерне). Нужна средняя за 5 лет по стерневому предшественнику (stat.gov.kz)"}
    price_kzt_t:
      {value: 104000, unit: "тенге/т", source: moa_prices_2026, status: verified, evidence: literature,
       note: "МСХ РК, 27.07.2026: пшеница мягкая 3 класса, клейковина до 25 % — 104 тг/кг (28 % и выше — 115), с НДС, с элеватора. Тот же документ и та же дата, что у цен льна, рапса, подсолнечника, гороха и чечевицы. До аудита стояло 67 500 тг/т из постановки задачи (65–70 тыс.): значение другой даты; смешение источников завышало выгоду диверсификации. Результаты при прежней цене — docs/audit/AUDIT_TABLES_v0.1-rules.md"}
    cost_kzt_ha:
      {value: 60000, unit: "тенге/га", source: expert_guess, status: assumption, evidence: preliminary,
       note: "TODO: проверить у агронома. Ориентир для уточнения — нормативы затрат на гектар по областям (zakon.uchet.kz, V1500011418)"}
    water_need_mm:
      {value: 550, unit: "мм", source: fao_water_needs, status: assumption, evidence: agronomist_review,
       note: "FAO (Brouwer & Heibloem 1986, табл. 5): пшеница/ячмень/овёс 450–650 мм при вегетации 120–150 дней — сверено 12.11.2026, взята середина. В Северном Казахстане вегетация короче; измеренное суммарное испарение посевов 194–259 мм (Funakawa et al., 2004). Рекомендация: рассчитать ETm = Kc × ET0 по данным поля. Чувствительность: при 400 мм доход вариантов меняется менее чем на 2 %"}
    ky:
      {value: 1.15, unit: "—", source: fao56, status: verified, evidence: literature,
       note: "FAO-56, табл. 24 (по FAO-33): Spring wheat Ky = 1,15 — сверено с текстом FAO 12.11.2026"}
    nitrogen_balance_kg_ha:
      {value: -25, unit: "кг N/га в год", source: expert_guess, status: assumption, evidence: agronomist_review,
       note: "Баланс массы: вынос с зерном ~1,1 т/га × ~2,3 % N ≈ 25 кг N/га; без удобрений, солома остаётся в поле, минерализация не учтена. Содержание азота в зерне — справочная величина, сверить с агрохимслужбой"}
    humus_balance_t_ha:
      {value: -0.5, unit: "т/га в год", source: kazhydromet_humus, status: assumption, evidence: literature,
       note: "Саттыбаева (2004): чистые потери гумуса под зерновыми 0,5–1 т/га в год в зависимости от уровня урожая — сверено с текстом статьи. При низкой урожайности севера взята нижняя граница диапазона"}

